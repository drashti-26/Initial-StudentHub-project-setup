<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Events API Demo</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="container py-4"><h1>StudentHub Events (Fetch API)</h1><p id="status" role="status">Loading events...</p><div id="events" class="row g-3"></div><script>
fetch('api_events.php').then(r=>{if(!r.ok)throw new Error('Request failed: '+r.status);return r.json()}).then(result=>{if(!result.success)throw new Error(result.message||'API error');document.getElementById('status').textContent='Events loaded successfully.';document.getElementById('events').innerHTML=result.data.map(e=>`<div class="col-md-6"><div class="card p-3"><h2 class="h5"></h2><p class="date"></p><p class="desc"></p></div></div>`).join('');const cards=document.querySelectorAll('#events .card');result.data.forEach((e,i)=>{cards[i].querySelector('h2').textContent=e.title;cards[i].querySelector('.date').textContent=e.event_date;cards[i].querySelector('.desc').textContent=e.description||''})}).catch(err=>{document.getElementById('status').textContent='Error loading events. Check database connection.'});
</script><p class="mt-4"><a href="home.php">Home</a></p></body></html>
