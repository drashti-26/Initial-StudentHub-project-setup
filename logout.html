<!DOCTYPE html>
<html>
<head>
    <title>Logout - Student Hub Portal</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin: 0;
        }

        .logout-box{
            width: 400px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            border: 1px solid black;
            border-radius: 10px;
        }

        h1{
            color: #003366;
        }

        p{
            font-size: 18px;
        }

        a{
            text-decoration: none;
            background-color: #003366;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 20px;
        }

        a:hover{
            background-color: #0055aa;
        }
    </style>

</head>

<body>

    <div class="logout-box">

        <h1>Logged Out Successfully</h1>

        <p>Thank you for using the Student Hub Portal.</p>

        <p>You have been logged out successfully.</p>

        <a href="home.html">Go to Home Page</a>

    </div>

</body>
</html>
