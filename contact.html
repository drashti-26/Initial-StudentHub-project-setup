<!DOCTYPE html>
<html>
<head>
    <title>Contact Us - Student Hub Portal</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        h1{
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        .container{
            width: 50%;
            margin: 40px auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        label{
            font-size: 18px;
        }

        input, textarea{
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            font-size: 16px;
        }

        button{
            width: 100%;
            padding: 10px;
            background-color: #003366;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover{
            background-color: #0055aa;
        }

        .home{
            text-align: center;
            margin-top: 20px;
        }

        .home a{
            text-decoration: none;
            color: blue;
        }

        .details{
            margin-top: 30px;
            text-align: center;
            line-height: 30px;
        }
    </style>
</head>

<body>

    <h1>Contact Us</h1>

    <div class="container">

        <form>

            <label>Name</label><br>
            <input type="text" placeholder="Enter your name" required>

            <label>Email</label><br>
            <input type="email" placeholder="Enter your email" required>

            <label>Message</label><br>
            <textarea rows="5" placeholder="Write your message here..." required></textarea>

            <button type="submit">Send Message</button>

        </form>

        <div class="details">
            <h3>Student Hub Portal</h3>

            <p>
                📍 MIT-ADT UNIVERSITY, PUNE, INDIA
            </p>

            <p>
                📧 studenthub@mit-adt.edu.in
            </p>

            <p>
                📞 +91 98765 43210
            </p>
        </div>

        <div class="home">
            <a href="home.html">← Back to Home</a>
        </div>

    </div>

</body>
</html>
