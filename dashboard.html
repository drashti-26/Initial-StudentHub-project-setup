<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Student Hub Portal</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        h1{
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        h2{
            text-align: center;
            margin-top: 30px;
        }

        .container{
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .card{
            width: 220px;
            height: 150px;
            background-color: white;
            border: 2px solid #003366;
            border-radius: 10px;
            text-align: center;
            padding-top: 40px;
        }

        .card h3{
            margin-bottom: 20px;
        }

        .card a{
            text-decoration: none;
            color: white;
            background-color: #003366;
            padding: 10px 20px;
            border-radius: 5px;
        }

        .card a:hover{
            background-color: #0055aa;
        }
    </style>

</head>

<body>

    <h1>Student Hub Portal</h1>

    <h2>Welcome to Your Dashboard</h2>

    <div class="container">

        <div class="card">
            <h3>Profile</h3>
            <a href="profile.html">Open</a>
        </div>

        <div class="card">
            <h3>Timetable</h3>
            <a href="timetable.html">Open</a>
        </div>

        <div class="card">
            <h3>Attendance</h3>
            <a href="attendance.html">Open</a>
        </div>

        <div class="card">
            <h3>Logout</h3>
            <a href="home.html">Logout</a>
        </div>

    </div>

</body>
</html>
