<!DOCTYPE html>
<html>
<head>
    <title>Profile - Student Hub Portal</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        h1{
            background-color: #003366;
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        .profile-box{
            width: 500px;
            margin: 40px auto;
            background-color: white;
            padding: 20px;
            border: 1px solid black;
            border-radius: 10px;
        }

        h2{
            text-align: center;
            color: #003366;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        td{
            padding: 12px;
            border-bottom: 1px solid #ccc;
        }

        .back{
            text-align: center;
            margin-top: 30px;
        }

        .back a{
            text-decoration: none;
            background-color: #003366;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }

        .back a:hover{
            background-color: #0055aa;
        }
    </style>

</head>

<body>

    <h1>Student Profile</h1>

    <div class="profile-box">

        <h2>Profile Details</h2>

        <table>

            <tr>
                <td><b>Name</b></td>
                <td>Drashti Gondha</td>
            </tr>

            <tr>
                <td><b>Enrollment No.</b></td>
                <td>25CS017</td>
            </tr>

            <tr>
                <td><b>Course</b></td>
                <td>B.Tech Computer Science</td>
            </tr>

            <tr>
                <td><b>Semester</b></td>
                <td>Semester 2</td>
            </tr>

            <tr>
                <td><b>Email</b></td>
                <td>drashti@example.com</td>
            </tr>

            <tr>
                <td><b>Phone</b></td>
                <td>+91 9876543210</td>
            </tr>

        </table>

        <div class="back">
            <a href="dashboard.html">← Back to Dashboard</a>
        </div>

</body>
</html>
